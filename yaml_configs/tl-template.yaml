# Board: Denky32 (WROOM32)
# Definition: definitions/boards/denky32/manifest.yaml

esphome:
  name: tl-template
  friendly_name: tl-template

esp32:
  variant: ESP32

logger:

api:
  encryption:
    key: "***"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: tl-template Fallback Hotspot
    password: "***"

captive_portal:

web_server:
  port: 80

globals:
  - id: working_thread
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: working_flag
    type: bool
    restore_value: yes
    initial_value: 'false'
  # configs 
  - id: red_pin
    type: int
    restore_value: yes
    initial_value: '17'
  - id: yellow_pin
    type: int
    restore_value: yes
    initial_value: '27'
  - id: green_pin
    type: int
    restore_value: yes
    initial_value: '22'
  - id: red_time
    type: int
    restore_value: yes
    initial_value: '7000'
  - id: yellow_time
    type: int
    restore_value: yes
    initial_value: '1000'
  - id: green_time
    type: int
    restore_value: yes
    initial_value: '13000'
  - id: green_time_blinking
    type: int
    restore_value: yes
    initial_value: '2000'
  - id: yellow_blinking_time
    type: int
    restore_value: yes
    initial_value: '400'

substitutions:
  green_pin_id: GPIO22
  yellow_pin_id: GPIO27
  red_pin_id: GPIO17

number:
  - platform: template
    name: "red_time_config"
    id: red_time_config
    min_value: 1
    max_value: 9999999
    step: 1
    optimistic: true
    set_action:
      - lambda: |-
          id(red_time) = (int)x;
          
  - platform: template
    name: "yellow_time_config"
    id: yellow_time_config
    min_value: 1
    max_value: 9999999
    step: 1
    optimistic: true
    set_action:
      - lambda: |-
          id(yellow_time) = (int)x;
          
  - platform: template
    name: "green_time_config"
    id: green_time_config
    min_value: 1
    max_value: 9999999
    step: 1
    optimistic: true
    set_action:
      - lambda: |-
          id(green_time) = (int)x;
          
  - platform: template
    name: "green_time_blinking_config"
    id: green_time_blinking_config
    min_value: 1
    max_value: 1000
    step: 1
    optimistic: true
    set_action:
      - lambda: |-
          id(green_time_blinking) = (int)x;
          
  - platform: template
    name: "yellow_time_blinking_config"
    id: yellow_time_blinking_config
    min_value: 1
    max_value: 1000
    step: 1
    optimistic: true
    set_action:
      - lambda: |-
          id(yellow_blinking_time) = (int)x;

output:
  - platform: gpio
    id: green
    pin: ${green_pin_id}
  - platform: gpio
    id: yellow
    pin: ${yellow_pin_id}
  - platform: gpio
    id: red
    pin: ${red_pin_id}

light:
  - platform: binary
    name: green_light
    id: green_light
    output: green
  - platform: binary
    name: yellow_light
    id: yellow_light
    output: yellow
  - platform: binary
    name: red_light
    id: red_light
    output: red

script:
  - id: traffic_light_mode
    mode: single
    then:
      - while:
          condition:
            lambda: |-
              return id(working_thread);
          then:
            - light.turn_on: red_light
            - delay: !lambda return id(red_time);
            - light.turn_off: red_light
            - light.turn_on: yellow_light
            - delay: !lambda return id(yellow_time);
            - light.turn_off: yellow_light
            - light.turn_on: green_light
            - delay: !lambda return id(green_time);
            - light.turn_off: green_light
            - repeat:
                count: 3
                then:
                  - delay:
                      milliseconds: '400'
                  - light.turn_on: green_light
                  - delay:
                      milliseconds: '400'
                  - light.turn_off: green_light
            - light.turn_on: yellow_light
            - delay: !lambda return id(yellow_time);
            - light.turn_off: yellow_light
      - lambda: !lambda id(working_flag) = false;
  - id: yellow_blinking_mode
    mode: single
    then:
      - while:
          condition:
            lambda: |-
              return id(working_thread);
          then:
            - light.turn_on: yellow_light
            - delay: !lambda return id(yellow_blinking_time);
            - light.turn_off: yellow_light
            - delay: !lambda return id(yellow_blinking_time);
      - lambda: !lambda id(working_flag) = false;
  - id: traffic_light_test
    mode: single
    then:
      - repeat:
          count: 3
          then:
            - light.turn_on: red_light
            - delay: !lambda return id(500);
            - light.turn_off: red_light
            - light.turn_on: yellow_light
            - delay: !lambda return id(500);
            - light.turn_off: yellow_light
            - light.turn_on: green_light
            - delay: !lambda return id(500);
            - light.turn_off: green_light


switch:
  - platform: template
    name: "tlon"
    id: traffic_light_on_switch
    optimistic: true
    turn_on_action:
      - while:
          condition:
            lambda: |
              return id(working_flag);
          then:
            - delay:
                milliseconds: '1'
      - lambda: !lambda id(working_thread) = true;
      - lambda: !lambda id(working_flag) = true;
      - script.execute: traffic_light_mode
    turn_off_action:
      - lambda: !lambda id(working_thread) = false;
  - platform: template
    name: "tlyb"
    id: yellow_blinking_mode_switch
    optimistic: true
    turn_on_action:
      - while:
          condition:
            lambda: |
              return id(working_flag);
          then:
            - delay:
                milliseconds: '1'
      - lambda: !lambda id(working_thread) = true;
      - lambda: !lambda id(working_flag) = true;
      - script.execute: yellow_blinking_mode
    turn_off_action:
      - lambda: !lambda id(working_thread) = false;
  - platform: template
    name: "tlt"
    id: traffic_light_test_switch
    optimistic: true
    turn_on_action:
      - script.execute: traffic_light_test
  - platform: template
    name: "tloff"
    id: traffic_light_off_switch
    optimistic: true
    turn_on_action:
      - lambda: !lambda id(working_thread) = false;
